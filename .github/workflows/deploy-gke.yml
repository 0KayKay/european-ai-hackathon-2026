name: Deploy to GKE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gke-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: european-ai-hackathon-2026
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: hackathon-github-deployer@european-ai-hackathon-2026.iam.gserviceaccount.com
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push images
        run: |
          repo=europe-west1-docker.pkg.dev/european-ai-hackathon-2026/hackathon-2026
          docker buildx build --platform linux/amd64 -t "$repo/backend:$GITHUB_SHA" --push backend
          docker buildx build --platform linux/amd64 -t "$repo/deepteam:$GITHUB_SHA" --push deepteam
          docker buildx build --platform linux/amd64 -t "$repo/guardrail:$GITHUB_SHA" --push guardrail
          docker buildx build --platform linux/amd64 -t "$repo/auth:$GITHUB_SHA" --push -f frontend/Dockerfile.auth frontend
          docker buildx build --platform linux/amd64 -t "$repo/frontend:$GITHUB_SHA" --push frontend

      - uses: google-github-actions/auth@v3
        with:
          project_id: european-ai-hackathon-2026
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: hackathon-github-deployer@european-ai-hackathon-2026.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: kubectl

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: european-ai-hackathon-2026
          cluster_name: hackathon-2026
          location: europe-west1

      - name: Deploy and verify
        env:
          LEONARDO_ENABLED: ${{ vars.LEONARDO_ENABLED }}
        run: |
          sed -i -E "s/^(    newTag: ).*/\1$GITHUB_SHA/" infrastructure/gke/kustomization.yaml
          overlay=infrastructure/gke
          if [ "$LEONARDO_ENABLED" = "true" ]; then
            overlay=infrastructure/gke-leonardo
          fi
          kubectl apply -k "$overlay"
          for deployment in auth backend deepteam guardrail frontend agentgateway phoenix postgres; do
            kubectl rollout status --timeout=5m "deployment/$deployment"
          done
          if [ "$LEONARDO_ENABLED" = "true" ]; then
            kubectl rollout status --timeout=5m deployment/leonardo-link
          fi
