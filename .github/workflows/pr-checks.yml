name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: '3.14'
      - run: uv sync --locked --group dev --group test
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q

  deepteam:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deepteam
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: '3.13'
      - run: uv sync --locked --group dev --group test
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q

  guardrail:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guardrail
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: '3.14'
      - run: uv sync --locked --group dev --group test
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q

  leonardo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leonardo
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: python3 tools/check_repository.py
      - run: python3 -m unittest discover -s tests -v
      # Leonardo's login nodes run Python 3.6; the admin CLI needs 3.7 on the admin's machine. Excluded: code
      # that runs inside containers with a modern Python (the compatibility check, the cluster link PoC stubs).
      - run: uvx vermin==1.9.2 --target=3.6- --no-tips --violations --exclude-regex 'compat_check\.py$|cluster_link_poc/' serve tools diagnostics install tests
      - run: uvx vermin==1.9.2 --target=3.7- --no-tips --violations cli.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm exec tsc -p tsconfig.app.json --noEmit
      - run: pnpm test
      - run: pnpm run test:auth
