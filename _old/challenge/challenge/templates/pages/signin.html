{% extends "base.html" %}

{% block title %}AIxCHANGE | Sign In{% endblock %}

{% block content %}
<div class="mx-auto max-w-7xl px-4 py-12 min-h-[80vh]">
    <div class="max-w-md mx-auto">
        <div class="flex flex-col gap-4 mb-10 text-center">
            <h2 class="text-slate-900 dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">Welcome Back</h2>
            <p class="text-slate-500 dark:text-[#9da6b9] text-base font-normal leading-normal">
                Sign in to continue your challenges
            </p>
        </div>

        <!-- Sign In Form -->
        <div class="flex flex-col gap-6 p-6 bg-white dark:bg-[#111318] rounded-xl border border-slate-200 dark:border-[#282e39]">
            <h3 class="text-slate-900 dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em]">Sign In</h3>
            <form class="flex flex-col gap-4">
                <div class="flex flex-col">
                    <label class="text-slate-800 dark:text-white text-base font-medium leading-normal pb-2" for="signin-email">Email</label>
                    <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-[#3b4354] bg-transparent dark:bg-[#1c1f27] h-14 placeholder:text-slate-400 dark:placeholder:text-[#9da6b9] p-[15px] text-base font-normal leading-normal"
                        id="signin-email"
                        placeholder="your.email@example.com"
                        type="email"
                        required
                    />
                </div>
                <div class="flex flex-col">
                    <label class="text-slate-800 dark:text-white text-base font-medium leading-normal pb-2" for="signin-password">Password</label>
                    <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-[#3b4354] bg-transparent dark:bg-[#1c1f27] h-14 placeholder:text-slate-400 dark:placeholder:text-[#9da6b9] p-[15px] text-base font-normal leading-normal"
                        id="signin-password"
                        placeholder="Enter your password"
                        type="password"
                        required
                    />
                </div>
                <div class="flex items-center justify-between">
<!--                    <label class="flex items-center gap-2 cursor-pointer">-->
<!--                        <input type="checkbox" class="w-4 h-4 rounded border-slate-300 dark:border-[#3b4354] text-primary focus:ring-primary/50" />-->
<!--                        <span class="text-sm text-slate-600 dark:text-slate-400">Remember me</span>-->
<!--                    </label>-->
                    <a href="#" class="text-sm text-primary hover:underline">Forgot password?</a>
                </div>
                <div class="flex flex-col gap-3 pt-2">
                    <button
                        class="flex items-center justify-center gap-2 overflow-hidden rounded-lg h-12 px-6 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors"
                        type="submit"
                    >
                        Sign In
                    </button>
                </div>
            </form>
            <div class="text-center">
                <p class="text-sm text-slate-600 dark:text-slate-400">
                    Don't have an account? <a href="/signup" class="text-primary hover:underline font-semibold">Sign Up →</a>
                </p>
            </div>
        </div>

        <!-- Social Login Options -->
        <div class="mt-6">
            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-300 dark:border-[#3b4354]"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-background-light dark:bg-background-dark text-slate-500 dark:text-slate-400">Or continue with</span>
                </div>
            </div>
            <div class="mt-6 grid grid-cols-2 gap-3">
                <button
                    type="button"
                    class="flex items-center justify-center gap-2 h-12 px-4 border border-slate-300 dark:border-[#3b4354] rounded-lg bg-white dark:bg-[#1c1f27] text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-[#282e39] transition-colors"
                >
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span class="text-sm font-medium">Google</span>
                </button>
                <button
                    type="button"
                    class="flex items-center justify-center gap-2 h-12 px-4 border border-slate-300 dark:border-[#3b4354] rounded-lg bg-white dark:bg-[#1c1f27] text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-[#282e39] transition-colors"
                >
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    <span class="text-sm font-medium">GitHub</span>
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
