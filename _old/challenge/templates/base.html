<!DOCTYPE html>
<html class="scroll-smooth" lang="de">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}Your App{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/_old/publicn.svg">
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;display=swap"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script src="/_old/publicnd-extract.js"></script>
    <script defer src="/_old/public.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#00AEEF",
                        "background-light": "#FFFFFF",
                        "background-dark": "#0B153A",
                        "surface-dark": "#111C44",
                        "text-light": "#FFFFFF",
                        "text-secondary": "#B0B8D9",
                        "border-dark": "#2a3661",

                    },
                    fontFamily: {
                        display: ["Montserrat", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        };
    </script>
    <style>
        .x-separator {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 2.5rem;
            color: #00AEEF;
            transform: scaleY(0.75);
        }
        details.accordion-card summary {
          list-style: none;
        }
        details.accordion-card summary::-webkit-details-marker {
          display: none;
        }
        .accordion-icon {
          transition: transform 0.2s ease;
        }
        details[open] .accordion-icon {
          transform: rotate(180deg);
        }
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        .arrow {
          position: relative;
        }
        .arrow::after {
          content: '';
          position: absolute;
          width: 0;
          height: 0;
          border-top: 6px solid transparent;
          border-bottom: 6px solid transparent;
        }
        .arrow-right::after {
          border-left: 8px solid;
          right: -12px;
          top: 50%;
          transform: translateY(-50%);
        }
        .arrow-bidirectional::before {
          content: '';
          position: absolute;
          width: 0;
          height: 0;
          border-top: 6px solid transparent;
          border-bottom: 6px solid transparent;
          border-right: 8px solid;
          left: -12px;
          top: 50%;
          transform: translateY(-50%);
        }
    </style>
</head>
<body x-data="{ mobileMenuOpen: false }" class="min-w-[320px] bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200 min-h-screen">
{% include 'components/nav.html' %}
<main class="px-5">
    {% block content %}{% endblock %}
</main>
{% include 'components/footer.html' %}
</body>
</html>
