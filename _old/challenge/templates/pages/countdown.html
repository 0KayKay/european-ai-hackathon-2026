{% extends "base.html" %}

{% block title %}AIxCHANGE | Countdown{% endblock %}

{% block content %}
<div class="container mx-auto px-6 py-20 md:py-32 text-center">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-white leading-tight">
            Du bist registriert.
        </h1>
        <p class="text-xl md:text-2xl mt-6 text-gray-700 dark:text-gray-300">Die AIxCHANGE Prompt Injection Challenge
        beginnt bald. Der Countdown hat begonnen!</p>
        <div class="mt-12 md:mt-16">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 md:gap-8 max-w-2xl mx-auto" id="countdown-timer">
                <div class="flex flex-col items-center justify-center bg-primary/10 dark:bg-primary/5 p-6 rounded-lg shadow-inner">
                    <span id="days" class="text-5xl md:text-7xl font-bold text-primary tracking-tighter">--</span>
                    <span class="text-sm md:text-base font-semibold text-gray-600 dark:text-gray-300 mt-2">Tage</span>
                </div>
                <div class="flex flex-col items-center justify-center bg-primary/10 dark:bg-primary/5 p-6 rounded-lg shadow-inner">
                    <span id="hours" class="text-5xl md:text-7xl font-bold text-primary tracking-tighter">--</span>
                    <span class="text-sm md:text-base font-semibold text-gray-600 dark:text-gray-300 mt-2">Stunden</span>
                </div>
                <div class="flex flex-col items-center justify-center bg-primary/10 dark:bg-primary/5 p-6 rounded-lg shadow-inner">
                    <span id="minutes" class="text-5xl md:text-7xl font-bold text-primary tracking-tighter">--</span>
                    <span class="text-sm md:text-base font-semibold text-gray-600 dark:text-gray-300 mt-2">Minuten</span>
                </div>
                <div class="flex flex-col items-center justify-center bg-primary/10 dark:bg-primary/5 p-6 rounded-lg shadow-inner">
                    <span id="seconds" class="text-5xl md:text-7xl font-bold text-primary tracking-tighter">--</span>
                    <span class="text-sm md:text-base font-semibold text-gray-600 dark:text-gray-300 mt-2">Sekunden</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Countdown timer JavaScript
    function updateCountdown() {
        // Target date: November 24, 2025 13:30 CET
        const targetDate = new Date('2025-11-24T13:30:00+01:00').getTime();
        const now = new Date().getTime();
        const distance = targetDate - now;

        if (distance > 0) {
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        } else {
            window.location.href = "../../dashboard";
        }
    }

    // Update countdown every second
    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>
{% endblock %}
