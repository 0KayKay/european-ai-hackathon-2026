[project]
name = "hackathon-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ag-ui-protocol>=1.0.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi",
    "httpx>=0.28.1",
    "logfire[fastapi]>=5.1.1",
    "openinference-instrumentation-pydantic-ai>=0.1.30",
    "orjson>=3.13.0",
    "pydantic-ai>=2.55.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-random-order>=1.2.0",
]
