[project]
name = "hackathon-deepteam"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "agent-framework-ag-ui>=1.5,<2",
    "deepeval>=3.6.2",
    "deepteam==1.0.9",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "litellm>=1.105,<2",
    "pydantic-settings>=2,<3",
    "sentry-sdk>=2,<3",
    "structlog>=25,<27",
    "uvicorn>=0.30,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p no:rerunfailures"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = ["pre-commit>=4.6.2", "ruff>=0.17.0", "ty>=0.0.86"]
test = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]
