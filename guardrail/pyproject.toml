[project]
name = "hackathon-guardrail"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "uvicorn",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = ["ruff>=0.17.0"]
test = ["httpx>=0.28.1", "pytest>=9.1.1"]
