# yaml-language-server: $schema=https://agentgateway.dev/schema/config
gateways:
  default:
    port: 3000
config:
  logging:
    level: info
    format: json
routes:
  - matches:
      - path:
          pathPrefix: /api/
    policies:
      extAuthz:
        host: auth:3000
        includeRequestHeaders: [cookie]
        protocol:
          http:
            path: '"/api/auth/authorize"'
    backends:
      - host: backend:8000
llm:
  policies:
    extAuthz:
      host: auth:3000
      protocol:
        http:
          path: '"/api/auth/authorize-internal"'
    cors:
      allowOrigins:
        - http://localhost:4001
      allowMethods:
        - GET
        - POST
        - OPTIONS
  models:
    - name: "*"
      provider: vertex
      guardrails:
        request:
          - webhook:
              target:
                host: backend:8000
                policies:
                  http:
                    requestTimeout: "30s"
              headers:
                ":path": '"/guardrails/request"'
                x-challenge-difficulty: request.headers["x-challenge-difficulty"]
              failureMode: failClosed
      params:
        vertexProject: european-ai-hackathon-2026
        vertexRegion: global
      transformation:
        model: '"google/" + llmRequest.model'
      auth:
        gcp:
          type: accessToken
