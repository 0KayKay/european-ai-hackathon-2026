# yaml-language-server: $schema=https://agentgateway.dev/schema/config
gateways:
  default:
    port: 3000
config:
  logging:
    level: info
    format: json
routes:
  - matches:
      - path:
          pathPrefix: /api/
    policies:
      extAuthz:
        host: auth:3000
        includeRequestHeaders: [cookie]
        protocol:
          http:
            path: '"/api/auth/authorize"'
    backends:
      - host: backend:8000
llm:
  policies:
    guardrails:
      streaming: Enabled
      request:
        - webhook:
            target:
              host: guardrail:8000
            headers:
              x-model: llmRequest.model
              x-user-id: 'request.headers["x-user-id"]'
              x-request-id: 'request.headers["x-request-id"]'
              x-run-id: 'request.headers["x-run-id"]'
              x-thread-id: 'request.headers["x-thread-id"]'
              x-correlation-id: 'request.headers["x-correlation-id"]'
              x-tenant-id: 'request.headers["x-tenant-id"]'
              user-agent: 'request.headers["user-agent"]'
              traceparent: 'request.headers["traceparent"]'
              tracestate: 'request.headers["tracestate"]'
              x-original-path: request.path
              x-original-method: request.method
      response:
        - webhook:
            target:
              host: guardrail:8000
            headers:
              x-model: 'request.headers["x-model"]'
              x-user-id: 'request.headers["x-user-id"]'
              x-request-id: 'request.headers["x-request-id"]'
              x-run-id: 'request.headers["x-run-id"]'
              x-thread-id: 'request.headers["x-thread-id"]'
              x-correlation-id: 'request.headers["x-correlation-id"]'
              x-tenant-id: 'request.headers["x-tenant-id"]'
              user-agent: 'request.headers["user-agent"]'
              traceparent: 'request.headers["traceparent"]'
              tracestate: 'request.headers["tracestate"]'
              x-original-path: request.path
              x-original-method: request.method
    extAuthz:
      host: auth:3000
      protocol:
        http:
          path: '"/api/auth/authorize-internal"'
    cors:
      allowOrigins:
        - http://localhost:4001
      allowMethods:
        - GET
        - POST
        - OPTIONS
  models:
    - name: "*"
      provider: vertex
      params:
        vertexProject: european-ai-hackathon-2026
        vertexRegion: global
      transformation:
        model: '"google/" + llmRequest.model'
      auth:
        gcp:
          type: accessToken
