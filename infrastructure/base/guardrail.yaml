apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  replicas: 1
  selector:
    matchLabels: {app: guardrail}
  template:
    metadata:
      labels: {app: guardrail}
    spec:
      containers:
        - name: guardrail
          image: local/guardrail
          env:
            - name: LOG_FORMAT
              value: json
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: guardrail
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  selector: {app: guardrail}
  ports:
    - port: 8000
