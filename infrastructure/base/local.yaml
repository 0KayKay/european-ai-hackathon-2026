apiVersion: v1
kind: Secret
metadata:
  name: local-db
  labels:
    app.kubernetes.io/part-of: hackathon
type: Opaque
stringData:
  password: devpassword
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app.kubernetes.io/part-of: hackathon
  annotations:
    tilt.dev/down-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-trixie
          env:
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_DB
              value: app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: local-db, key: password}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "app"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  replicas: 1
  selector:
    matchLabels: {app: phoenix}
  template:
    metadata:
      labels: {app: phoenix}
    spec:
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:latest
          env:
            - name: PHOENIX_PORT
              value: "6006"
            - name: PHOENIX_POSTGRES_HOST
              value: postgres
            - name: PHOENIX_POSTGRES_PORT
              value: "5432"
            - name: PHOENIX_POSTGRES_USER
              value: app
            - name: PHOENIX_POSTGRES_DB
              value: app
            - name: PHOENIX_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: local-db, key: password}
            - name: PHOENIX_SQL_DATABASE_SCHEMA
              value: phoenix
          ports:
            - containerPort: 6006
            - containerPort: 4317
          readinessProbe:
            httpGet: {path: /healthz, port: 6006}
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  selector: {app: phoenix}
  ports:
    - name: ui
      port: 6006
    - name: otlp-grpc
      port: 4317
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  replicas: 1
  selector:
    matchLabels: {app: auth}
  template:
    metadata:
      labels: {app: auth}
    spec:
      containers:
        - name: auth
          image: local/auth
          env:
            - name: BETTER_AUTH_URL
              value: http://localhost:5000
            - name: BETTER_AUTH_TRUSTED_ORIGINS
              value: http://localhost:5173
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef: {name: github-oauth, key: auth_secret}
            - name: GITHUB_CLIENT_ID
              value: Ov23liQaIDLiOcBbnFp0
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: github-oauth, key: client_secret}
            - name: ALLOWED_EMAILS
              value: "*@codify.ch,*@lapiscode.com,*@calenora.com"
            - name: GATEWAY_INTERNAL_KEY
              valueFrom:
                secretKeyRef: {name: gateway-internal, key: key}
            - name: DB_HOST
              value: postgres
            - name: DB_USER
              value: app
            - name: DB_NAME
              value: app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: local-db, key: password}
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: {path: /api/auth/ok, port: 3000}
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  selector: {app: auth}
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: backend
          image: local/backend
          env:
            - name: AGENTGATEWAY_URL
              value: http://agentgateway:3000/v1
            - name: AGENTGATEWAY_API_KEY
              valueFrom:
                secretKeyRef: {name: gateway-internal, key: key}
            - name: AUTH_SERVICE_URL
              value: http://auth:3000
            - name: GOOGLE_STORAGE_BUCKET
              value: ""
            - name: PRETTY_DOMAIN
              value: localhost:5000
            - name: PHOENIX_OTLP_ENDPOINT
              value: http://phoenix:6006/v1/traces
            - name: DB_HOST
              value: postgres
            - name: DB_USER
              value: app
            - name: DB_NAME
              value: app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: local-db, key: password}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  selector: {app: backend}
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  replicas: 1
  selector:
    matchLabels: {app: agentgateway}
  template:
    metadata:
      labels: {app: agentgateway}
    spec:
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway:v1.6.0
          args: ["-f", "/config/config.yaml"]
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/google/credentials.json
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: config
              mountPath: /config
            - name: google-credentials
              mountPath: /var/run/google
              readOnly: true
      volumes:
        - name: config
          configMap: {name: agentgateway-config}
        - name: google-credentials
          secret:
            secretName: agentgateway-google-credentials
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  selector: {app: agentgateway}
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: local/frontend
          ports:
            - containerPort: 80
            - containerPort: 6006
          readinessProbe:
            httpGet: {path: /, port: 80}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  selector: {app: frontend}
  ports:
    - port: 80
      name: app
    - port: 6006
      name: phoenix
