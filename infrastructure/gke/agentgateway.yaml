apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
spec:
  template:
    spec:
      serviceAccountName: agentgateway
      containers:
        - name: agentgateway
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              $patch: delete
          volumeMounts:
            - name: config
              mountPath: /config
            - mountPath: /var/run/google  # volumeMounts merge on mountPath, not name
              $patch: delete
      volumes:
        - name: google-credentials
          $patch: delete
