apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  template:
    spec:
      containers:
        - name: auth
          env:
            - name: BETTER_AUTH_URL
              value: https://european-ai-hackathon-2026.codify.ch
            - name: BETTER_AUTH_TRUSTED_ORIGINS
              value: https://european-ai-hackathon-2026.codify.ch
