apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: ENV
              value: prod
            - name: LOG_FORMAT
              value: json
            - name: LOG_LEVEL
              value: info
            - name: PRETTY_DOMAIN
              value: european-ai-hackathon-2026.codify.ch
            - name: PHOENIX_API_KEY
              valueFrom:
                secretKeyRef: {name: phoenix-collector, key: api-key}
