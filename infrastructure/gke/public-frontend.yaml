apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentgateway
  annotations:
    iam.gke.io/gcp-service-account: hackathon-agentgateway@european-ai-hackathon-2026.iam.gserviceaccount.com
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: frontend
spec:
  timeoutSec: 900
  healthCheck:
    requestPath: /
    port: 80
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: frontend
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: PERMANENT_REDIRECT
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: frontend
spec:
  domains:
    - european-ai-hackathon-2026.codify.ch
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: hackathon-2026-frontend
    networking.gke.io/managed-certificates: frontend
    networking.gke.io/v1beta1.FrontendConfig: frontend
spec:
  rules:
    - host: european-ai-hackathon-2026.codify.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: app
