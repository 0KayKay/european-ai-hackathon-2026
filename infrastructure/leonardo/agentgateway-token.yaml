# The router token the Leonardo router expects; used by the Leonardo routes in agentgateway.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
spec:
  template:
    spec:
      containers:
        - name: agentgateway
          volumeMounts:
            - name: leonardo-router
              mountPath: /var/run/leonardo-router
              readOnly: true
      volumes:
        - name: leonardo-router
          secret:
            secretName: leonardo-router
