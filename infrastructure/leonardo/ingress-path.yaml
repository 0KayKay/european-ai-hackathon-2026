# Reuses the public host and certificate: the chisel client connects to
# https://european-ai-hackathon-2026.codify.ch/leonardo-tunnel
- op: add
  path: /spec/rules/0/http/paths/0
  value:
    path: /leonardo-tunnel
    pathType: Prefix
    backend:
      service:
        name: leonardo-tunnel
        port:
          name: websocket
