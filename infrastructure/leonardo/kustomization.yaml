# Opt-in: connects agentgateway to the models on CINECA Leonardo through the cluster link. Not
# enabled yet: the router's outbound connection needs the organisers' approval. How to enable it on GKE
# (create the secrets leonardo-link and leonardo-router first, then add ../leonardo to the components of
# gke/kustomization.yaml), what it changes and how it was tested: README.md in this folder.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - link.yaml
configMapGenerator:
  # Base config plus one route per Leonardo model; regenerate with leonardo/tools/render_agentgateway.py.
  - name: agentgateway-config
    behavior: replace
    files:
      - config.yaml=agentgateway.yaml
patches:
  - path: agentgateway-token.yaml
  - path: ingress-path.yaml
    target:
      kind: Ingress
      name: frontend
