# The cluster link. The router job on Leonardo dials OUT to this chisel server (a WebSocket on the
# public Ingress under /leonardo-link) and opens one reverse port, 9000, inside this pod. agentgateway
# reaches the router through the leonardo-router Service. Nothing here logs in to Leonardo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leonardo-link
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  replicas: 1  # the reverse port exists only on the pod that holds the client session
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: leonardo-link}
  template:
    metadata:
      labels: {app: leonardo-link}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: chisel
          image: jpillora/chisel:1.13.0@sha256:e3e1f6e3563a643ff2c484e110685144c4a24b8fe5711cb7a0d236a4e3080d97
          args:
            - server
            - --port=8080
            - --reverse
            - --authfile=/etc/chisel/users.json
            - --keyfile=/etc/chisel/server.key
          ports:
            - containerPort: 8080
              name: websocket
            - containerPort: 9000
              name: router
          readinessProbe:
            httpGet: {path: /health, port: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: auth
              mountPath: /etc/chisel
              readOnly: true
      volumes:
        - name: auth
          secret:
            secretName: leonardo-link
---
apiVersion: v1
kind: Service
metadata:
  name: leonardo-link
  labels:
    app.kubernetes.io/part-of: hackathon
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "leonardo-link"}'
spec:
  selector: {app: leonardo-link}
  ports:
    - name: websocket
      port: 8080
      targetPort: websocket
---
apiVersion: v1
kind: Service
metadata:
  name: leonardo-router
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  selector: {app: leonardo-link}
  ports:
    - name: http
      port: 8080
      targetPort: router
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: leonardo-link
spec:
  # The load balancer would otherwise cut the long-lived WebSocket after 30 s.
  timeoutSec: 86400
  healthCheck:
    requestPath: /health
    port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: b300-router
  labels:
    app.kubernetes.io/part-of: hackathon
spec:
  selector: {app: leonardo-link}
  ports:
    - name: http
      port: 8080
      targetPort: 9001
