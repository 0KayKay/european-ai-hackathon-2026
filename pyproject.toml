[project]
name = "aixchange-challenge"
version = "0.1.0"
description = "LLM Challenge Repository"
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "alembic>=1.17.1",
    "asyncpg>=0.30.0",
    "chainlit>=2.8.4",
    "cloud-sql-python-connector>=1.18.5",
    "fastapi>=0.116.2",
    "greenlet>=3.2.4",
    "itsdangerous>=2.2.0",
    "langchain>=1.0.3",
    "langchain-google-genai>=3.0.1",
    "langgraph>=1.0.2",
    "langgraph-checkpoint-postgres>=3.0.1",
    "nest-asyncio>=1.6.0",
    "pydantic-ai>=1.9.0",
    "sqlalchemy>=2.0.44",
    "structlog>=25.5.0",
    "uvicorn (>=0.38.0,<0.39.0)",
    "pandas>=2.2.3",
    "silverspeak==2.2.0",
    "emoji>=2.15.0",
    "openai-guardrails>=0.1.5",
    "uvicorn (>=0.38.0,<0.39.0)",
    "psycopg-binary>=3.2.12",
    "langchain-google-vertexai>=3.0.3",
    "pytz>=2024.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.14.2",
]


[tool.uv]
# Force pandas >= 2.2.3 even if a dependency asks for 2.2.2.
# Needed for silverspeak.
# Otherwise it tries to build Pandas 2.2.2, which fails on my system (Ubuntu 24.04, amd64).
override-dependencies = ["pandas>=2.2.3"]
